services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: radartcell-app
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://radar_tcell:${POSTGRES_PASSWORD:-radar_tcell_password}@postgres:5432/radar_tcell?sslmode=require}
      APP_PORT: ${APP_PORT:-8080}
      ENV: ${ENV:-production}
      SERVE_FRONTEND: "false"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_password}
      REDIS_DB: ${REDIS_DB:-0}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_admin_password}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:5174}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:5174}
      SECURITY_HSTS: ${SECURITY_HSTS:-false}
      SECURITY_HSTS_MAX_AGE: ${SECURITY_HSTS_MAX_AGE:-31536000}
      SECURITY_FRAME_ANCESTORS: ${SECURITY_FRAME_ANCESTORS:-'none'}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-300}
      TECHNOLOGY_CACHE_TTL_SECONDS: ${TECHNOLOGY_CACHE_TTL_SECONDS:-60}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-public:
    build:
      context: .
      dockerfile: frontend/apps/web-public/Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_ADMIN_URL: ${WEB_ADMIN_URL:-http://localhost:5174}
        VITE_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
    container_name: radartcell-web-public
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5173:80"

  web-admin:
    build:
      context: .
      dockerfile: frontend/apps/web-admin/Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:5173}
        VITE_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ru}
    container_name: radartcell-web-admin
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5174:80"

  postgres:
    image: postgres:16
    container_name: radartcell-postgres
    environment:
      POSTGRES_DB: radar_tcell
      POSTGRES_USER: radar_tcell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_tcell_password}
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_tcell -d radar_tcell"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: radartcell-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change_me_redis_password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis_password}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
