name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar_tcell
          POSTGRES_PASSWORD: radar_tcell_password
          POSTGRES_DB: radar_tcell
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: backend
          args: --timeout=5m

      - name: Run unit tests
        run: go test ./...

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: Run migrations
        run: migrate -path migrations -database "postgres://radar_tcell:radar_tcell_password@localhost:5432/radar_tcell?sslmode=disable" up

      - name: Seed database
        env:
          DATABASE_URL: "postgres://radar_tcell:radar_tcell_password@localhost:5432/radar_tcell?sslmode=disable"
        run: |
          psql $DATABASE_URL -f migrations/seeds/0001_demo_data.sql
          psql $DATABASE_URL -f migrations/seeds/0002_more_technologies.sql

      - name: Run performance tests
        env:
          DATABASE_URL: "postgres://radar_tcell:radar_tcell_password@localhost:5432/radar_tcell?sslmode=disable"
          REDIS_ADDR: "localhost:6379"
        run: go test -v ./cmd -run TestGetTechnologiesLatency

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm -r --parallel typecheck

      - name: Build
        run: pnpm -r --parallel build
