# Nginx config for the public site container. Static SPA + API reverse proxy.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers on every response ---------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP: разрешаем себя + inline styles (Tailwind runtime вставляет только рантайм-переменные),
    # шрифты Google, картинки CDN, XHR/WebSocket на API.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.$host http://api.$host; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # --- Reverse proxy to the Go API for same-origin API calls -------------
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz { proxy_pass http://app:8080; }
    location = /readyz { proxy_pass http://app:8080; }

    # --- Static assets with hash in filename: cache forever -----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # --- index.html must never be cached (SPA shell) ------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # --- Fallback for the SPA router ---------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
